services:  
  app:
    image: bdc2026:latest
    pull_policy: never
    volumes:
      # 最终提交使用五年行情与行业 as-of 快照；只读挂载，避免容器改写源数据。
      - ./data_5y:/app/data_5y:ro
      - ./output:/app/output
      - ./temp:/app/temp
    working_dir: /app
    command: /bin/bash -lc '/app/init.sh && /app/test.sh'
    # 核心配置：指定NVIDIA运行时+暴露GPU
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    privileged: true
    mem_limit: 16g
    memswap_limit: 16g
    cpus: 10.0
